name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      # docgen-action removed: its Pages deploy conflicts with the viewer
      # served from master:/docs (branch mode). Restore it only together with
      # a combined Actions-mode deploy.
